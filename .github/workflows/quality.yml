name: Website quality

on:
  pull_request:
  push:
    branches:
      - agent/production-ready

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate local assets and required files
        run: python scripts/validate_site.py

      - name: Check for unresolved merge markers
        shell: bash
        run: |
          if grep -R -nE '^(<<<<<<<|=======|>>>>>>>)' \
            --exclude-dir=.git .; then
            exit 1
          fi